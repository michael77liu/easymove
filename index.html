<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIC Move Assistant</title>
    <!-- Commission Factory Verification Meta Tag -->
    <meta name="commission-factory-verification" content="3fb8e154e2854327b0ca7cd9afa38062" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-6 flex flex-col sm:flex-row justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight">VIC Move Assistant</h1>
            <p class="text-indigo-200 text-sm mt-1 sm:mt-0">Hyper-Local Victorian Relocation Guide</p>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full">
        
        <!-- Postcode Input Section -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-8">
            <h2 class="text-lg font-semibold text-slate-900 mb-2">Enter Your New Postcode</h2>
            <p class="text-sm text-slate-500 mb-4">Provide your Victorian postcode to automatically load your local council and tailored moving tasks.</p>
            <div class="flex gap-3">
                <input type="text" id="postcode-input" placeholder="e.g. 3018 or 3012" maxlength="4" 
                    class="flex-grow px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-lg">
                <button onclick="handlePostcodeSubmit()" 
                    class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2 rounded-lg transition-colors shadow-sm">
                    Generate Checklist
                </button>
            </div>
            <div id="location-status" class="mt-3 text-sm font-medium text-slate-600"></div>
        </div>

        <!-- Checklist Container -->
        <div id="checklist-container" class="space-y-4">
            <!-- Dynamically injected tasks will appear here -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-sm text-slate-500">
        <p>&copy; 2026 VIC Move Assistant. Built for Victorians.</p>
    </footer>

    <!-- Application Script -->
    <script>
        // Supabase Initialization Configuration
        const SUPABASE_URL = 'YOUR_SUPABASE_URL'; 
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        
        let supabaseClient = null;
        try {
            if (typeof supabase !== 'undefined' && SUPABASE_URL !== 'YOUR_SUPABASE_URL') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.warn('Supabase initialization deferred.');
        }

        // Local State
        let userProfile = {
            postcode: '',
            council: '',
            completedTasks: JSON.parse(localStorage.getItem('vic_move_completed') || '[]')
        };

        // Initialize UI from localStorage if available
        window.addEventListener('DOMContentLoaded', () => {
            const savedPostcode = localStorage.getItem('vic_move_postcode');
            if (savedPostcode) {
                document.getElementById('postcode-input').value = savedPostcode;
                userProfile.postcode = savedPostcode;
                fetchChecklistData(savedPostcode);
            }
        });

        async function handlePostcodeSubmit() {
            const inputVal = document.getElementById('postcode-input').value.trim();
            if (!inputVal || inputVal.length !== 4) {
                alert('Please enter a valid 4-digit Victorian postcode.');
                return;
            }

            userProfile.postcode = inputVal;
            localStorage.setItem('vic_move_postcode', inputVal);
            
            await fetchChecklistData(inputVal);
        }

        async function fetchChecklistData(postcode) {
            const statusEl = document.getElementById('location-status');
            const containerEl = document.getElementById('checklist-container');
            
            statusEl.textContent = `Searching council data for postcode ${postcode}...`;
            containerEl.innerHTML = '';

            try {
                // Postcode logic mapping for Western Suburbs & Victoria
                let councilName = "Hobsons Bay City Council"; 
                if (postcode === '3012') {
                    councilName = "Maribyrnong City Council (Maidstone)";
                } else if (postcode !== '3018') {
                    councilName = `Local Council for Postcode ${postcode}`;
                }
                userProfile.council = councilName;

                statusEl.innerHTML = `<span class="text-green-600 font-semibold">Matched Council:</span> ${councilName}`;

                // Render structured tasks with clean icons
                renderChecklist([
                    {
                        id: 'council_update',
                        title: `Notify ${councilName} of Change of Address`,
                        category: '🏛️ Local Council',
                        description: 'Update your household details for local waste collection services, animal registrations, and council rates.',
                        action_url: 'https://www.hobsonsbay.vic.gov.au'
                    },
                    {
                        id: 'vicroads_update',
                        title: 'Update Driver Licence & Vehicle Registration',
                        category: '🚗 State Government',
                        description: 'Update your residential address with VicRoads within 14 days of moving.',
                        action_url: 'https://www.vicroads.vic.gov.au/licences/manage-your-licence/update-address'
                    },
                    {
                        id: 'toll_update',
                        title: 'Update Toll Accounts (Linkt)',
                        category: '🛣️ Transport & Tolls',
                        description: 'Ensure your Linkt or other toll accounts are updated to avoid unexpected toll fines.',
                        action_url: 'https://www.linkt.com.au/help/accounts-billing/update-contact-details'
                    },
                    {
                        id: 'nbn_update',
                        title: 'Relocate Internet & NBN Services',
                        category: '⚡ Utilities & NBN',
                        description: 'Contact your ISP at least 2 weeks prior to arrange NBN activation at your new address.',
                        action_url: '#'
                    }
                ]);

            } catch (err) {
                console.error(err);
                statusEl.innerHTML = `<span class="text-red-600">Error retrieving data for this postcode.</span>`;
            }
        }

        function renderChecklist(tasks) {
            const containerEl = document.getElementById('checklist-container');
            containerEl.innerHTML = '';

            tasks.forEach(task => {
                const isCompleted = userProfile.completedTasks.includes(task.id);
                
                const card = document.createElement('div');
                card.className = `bg-white rounded-xl shadow-sm border p-5 transition-all ${isCompleted ? 'border-emerald-300 bg-emerald-50/30' : 'border-slate-200'}`;
                
                card.innerHTML = `
                    <div class="flex items-start justify-between">
                        <div class="flex items-start space-x-3">
                            <input type="checkbox" id="task-${task.id}" ${isCompleted ? 'checked' : ''} 
                                onclick="toggleTask('${task.id}')"
                                class="mt-1 h-5 w-5 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500 cursor-pointer">
                            <div>
                                <span class="inline-block px-2.5 py-0.5 text-xs font-semibold bg-indigo-100 text-indigo-800 rounded-full mb-1">${task.category}</span>
                                <h3 class="text-base font-semibold text-slate-900 ${isCompleted ? 'line-through text-slate-400' : ''}">${task.title}</h3>
                                <p class="text-sm text-slate-600 mt-1">${task.description}</p>
                            </div>
                        </div>
                        <a href="${task.action_url}" target="_blank" rel="noopener noreferrer" 
                            class="ml-4 shrink-0 inline-flex items-center text-sm font-medium text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg transition-colors">
                            Complete Online &rarr;
                        </a>
                    </div>
                `;
                containerEl.appendChild(card);
            });
        }

        function toggleTask(taskId) {
            const index = userProfile.completedTasks.indexOf(taskId);
            if (index > -1) {
                userProfile.completedTasks.splice(index, 1);
            } else {
                userProfile.completedTasks.push(taskId);
            }
            localStorage.setItem('vic_move_completed', JSON.stringify(userProfile.completedTasks));
            if (userProfile.postcode) {
                fetchChecklistData(userProfile.postcode);
            }
        }
    </script>
</body>
</html>
